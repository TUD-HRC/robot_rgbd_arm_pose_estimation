# Arm geometry and grip of each subject.
#
# Lengths in m: upper arm (acromion -> lateral epicondyle), forearm (lateral
# epicondyle -> ulnar styloid), hand (wrist -> grip centre).
#
# Grip offset: how the hand sits in the handle, as a rotation [x, y, z] in
# degrees about the hand frame's own axes (applied X, then Y, then Z) on top of
# ee_to_hand in ekf.yaml. grip_offset_<trial> is the one fitted to that
# recording; launched with trial:=<trial> the EKF uses it, otherwise
# grip_offset, and without either the universal grip (no offset).
